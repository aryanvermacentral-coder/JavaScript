<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style = "background-color: black; color: pink">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random()*10+1)
    div.setAttribute('title', 'genereated Title')
    div.style.backgroundColor = "blue"
    div.style.padding = "5px"
    //div is created in memory
    //it will be seen on the page when it is attached to the document
    // div.innerText = "Code"
    const addText = document.createTextNode("JAVA SCRIPT")
    div.appendChild(addText)
    //attach
    document.body.appendChild(div)
    
</script>
</html>
